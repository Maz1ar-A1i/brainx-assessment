[project]
name = "captchalab-ai"
version = "1.1.0"
description = "Playwright recognition, synthetic CAPTCHA solving and official provider verification for authorized test environments"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
